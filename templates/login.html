<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Venus Radio Admin</title>
  <style>
    body {
      background: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: white;
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(216, 27, 96, 0.3);
      width: 320px;
      box-sizing: border-box;
    }
    h2 {
      color: #d81b60;
      margin-bottom: 24px;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #880e4f;
    }
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      box-sizing: border-box;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: #d81b60;
      outline: none;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #d81b60;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background: #b0003a;
    }
    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 10px;
      background: #f8bbd0;
      color: #880e4f;
      font-weight: 600;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Ingresar a Venus Radio Admin</h2>
    <form id="login-form">
      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" placeholder="tu@correo.com" required />
      
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
      
      <button type="submit">Ingresar</button>
    </form>
    <div class="message" id="message"></div>
  </div>

<script>
  const form = document.getElementById('login-form');
  const messageBox = document.getElementById('message');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    messageBox.style.display = 'none';

    const email = form.email.value.trim();
    const password = form.password.value;

    try {
      const resp = await fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
      });

      const data = await resp.json();

      if (data.success) {
        messageBox.style.background = '#a5d6a7';
        messageBox.style.color = '#1b5e20';
        messageBox.textContent = 'Login exitoso, redireccionando...';
        messageBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = '/admin';
        }, 1200);
      } else {
        messageBox.style.background = '#f8bbd0';
        messageBox.style.color = '#880e4f';
        messageBox.textContent = data.message || 'Error al iniciar sesión';
        messageBox.style.display = 'block';
      }
    } catch (err) {
      messageBox.style.background = '#f8bbd0';
      messageBox.style.color = '#880e4f';
      messageBox.textContent = 'Error de conexión';
      messageBox.style.display = 'block';
    }
  });
</script>
</body>
</html>
